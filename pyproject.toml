[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallet-vitals"
version = "0.1.0"
description = "Accountless, evidence-grounded Aave risk copilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "aiosqlite>=0.22,<1",
  "eth-utils>=6,<7",
  "fastapi[standard]>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
wallet-vitals = "wallet_vitals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_vitals"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "blockchains",
  "db_handler.py",
  "main.py",
  "telegram_handler.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
